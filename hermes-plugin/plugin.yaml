name: godspeed-stickers
version: "1.1.0"
description: "Your agent ends a reply with a sticker tag such as sticker:done, and the person gets a Speedy sticker on Telegram instead of the tag."
author: Godspeed Mission Control (https://godspeedmissioncontrol.com)
kind: standalone
provides_hooks:
  - pre_llm_call
  - transform_llm_output
requires_env:
  - name: TELEGRAM_BOT_TOKEN
    description: "your Telegram bot's token, the same one the Hermes Telegram gateway uses"
    url: "https://t.me/BotFather"
    secret: true
