name: godspeed-stickers
version: "1.1.0"
description: "Your agent ends a reply with [[sticker:done]] and the person gets a Telegram sticker, not the tag."
author: Godspeed Mission Control (https://godspeedmissioncontrol.com)
kind: standalone
provides_hooks:
  - transform_llm_output
requires_env:
  - name: TELEGRAM_BOT_TOKEN
    description: "your Telegram bot's token, the same one the Hermes Telegram gateway uses"
    url: "https://t.me/BotFather"
    secret: true
