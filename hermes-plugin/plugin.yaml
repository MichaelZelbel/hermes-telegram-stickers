name: hermes-telegram-stickers
version: "2.0.0"
description: "Your agent ends a reply with a sticker tag such as sticker:done, and the person gets a Telegram sticker instead of the tag."
author: hermes-telegram-stickers (https://github.com/MichaelZelbel/hermes-telegram-stickers)
kind: standalone
provides_hooks:
  - pre_llm_call
  - transform_llm_output
requires_env:
  - name: TELEGRAM_BOT_TOKEN
    description: "your Telegram bot's token, the same one the Hermes Telegram gateway uses"
    url: "https://t.me/BotFather"
    secret: true
